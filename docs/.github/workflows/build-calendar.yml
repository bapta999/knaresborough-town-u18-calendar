name: Build Knaresborough U18 Women Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knaresborough-town-u18-women.ics
          git diff --cached --quiet || git commit -m "Update Knaresborough Town U18 Women calendar"
          git push
